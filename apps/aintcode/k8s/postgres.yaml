# --- CloudNativePG HA PostgreSQL cluster ---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: aintcode
spec:
  # 1 instance — temporary scale-down for clean re-join
  instances: 1

  # Database bootstrap
  bootstrap:
    initdb:
      database: aintcode
      owner: aintcode
      secret:
        name: postgres-secret

  # Storage: each instance gets its own PVC on its node
  storage:
    size: 2Gi
    storageClass: local-path

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  # Failover / switchover settings
  primaryUpdateStrategy: unsupervised

  # Resource limits (4GB Hetzner box)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
