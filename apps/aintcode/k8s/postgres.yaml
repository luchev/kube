# --- PostgreSQL (single instance) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aintcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: aintcode
            - name: POSTGRES_USER
              value: aintcode
            - name: POSTGRES_PASSWORD
              value: aintcode
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aintcode", "-d", "aintcode"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aintcode
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
