# Ingress for k3s (bundled Traefik ingress controller).
# TLS via cert-manager ClusterIssuer (letsencrypt-*).
# To switch issuer, update the cert-manager.io/cluster-issuer annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: aintcode
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - aintcode.com
      secretName: aintcode-tls
  rules:
    - host: aintcode.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
