# --- Server environment (secrets) ---
apiVersion: v1
kind: Secret
metadata:
  name: server-env
  namespace: aintcode
type: Opaque
stringData:
  DATABASE_URL: postgres://aintcode:***REMOVED***@postgres-rw:5432/aintcode
  SESSION_SECRET: ***REMOVED***
  APP_BASE_URL: "https://aintcode.luchev.dev"
  PORT: "8787"
---
# --- Fastify backend ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: aintcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/luchev/aintcode-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          envFrom:
            - secretRef:
                name: server-env
---
# Headless-ish ClusterIP so the web container can reach the API via DNS.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: aintcode
spec:
  selector:
    app: server
  ports:
    - port: 8787
      targetPort: 8787
