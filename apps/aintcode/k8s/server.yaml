# --- Fastify backend ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: aintcode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: ghcr.io/luchev/aintcode-server:latest
          # IfNotPresent so locally-loaded images work in kind, and cached
          # images work when the cluster has no registry auth configured.
          # For production, either set up a registry pull secret or pin a tag.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: DATABASE_URL
              value: postgres://aintcode:aintcode@postgres:5432/aintcode
            - name: SESSION_SECRET
              value: "change-me-in-production"
            - name: APP_BASE_URL
              value: "http://localhost"  # change to your domain when you have one
            - name: PORT
              value: "8787"
            # SMTP is optional for local testing — server starts without it
---
# Headless-ish ClusterIP so the web container can reach the API via DNS.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: aintcode
spec:
  selector:
    app: server
  ports:
    - port: 8787
      targetPort: 8787
