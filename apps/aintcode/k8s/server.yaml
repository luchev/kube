# --- Fastify backend ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: aintcode
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      imagePullSecrets:
        - name: ghcr-auth
      containers:
        - name: server
          image: ghcr.io/luchev/aintcode/aintcode-server:0.1.0-build.0 # {"$imagepolicy": "flux-system:aintcode-server"}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          envFrom:
            - secretRef:
                name: server-env
---
# Headless-ish ClusterIP so the web container can reach the API via DNS.
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: aintcode
spec:
  selector:
    app: server
  ports:
    - port: 8787
      targetPort: 8787
