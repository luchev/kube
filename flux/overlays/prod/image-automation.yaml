---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aintcode-server
  namespace: flux-system
spec:
  image: ghcr.io/luchev/aintcode/aintcode-server
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: aintcode-web
  namespace: flux-system
spec:
  image: ghcr.io/luchev/aintcode/aintcode-web
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aintcode-server
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aintcode-server
  policy:
    semver:
      range: '>=0.1.0-build.0 <0.2.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: aintcode-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: aintcode-web
  policy:
    semver:
      range: '>=0.1.0-build.0 <0.2.0'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}'
    push:
      branch: main
  update:
    path: ./apps/aintcode/k8s
    strategy: Setters
