---
# The GitRepository that Flux sources from.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  timeout: 60s
  url: ssh://git@github.com/luchev/kube.git
---
# The Kustomization that reconciles everything under ./flux/overlays/prod.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  force: false
  interval: 1m0s
  path: ./flux/overlays/prod
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
