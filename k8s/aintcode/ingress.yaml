# Ingress for k3s (bundled Traefik ingress controller).
# For HTTP-only testing. Add TLS + cert-manager when you have a domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: aintcode
  annotations:
    # Allow large POST bodies for code submission
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: traefik
  rules:
    # Change this to your domain when you set up DNS
    - host: aintcode.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
