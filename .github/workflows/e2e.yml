name: E2E — Deployment Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CLUSTER_NAME: aintcode-e2e
  TEST_TAG: e2e-ci-${{ github.sha }}
  TEST_TAG_2: e2e-ci-${{ github.sha }}-updated

jobs:
  e2e:
    name: E2E Deployment Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Install kind
        run: |
          curl -sSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x /tmp/kind && sudo mv /tmp/kind /usr/local/bin/kind

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Install oras
        uses: oras-project/setup-oras@v1

      - name: Run e2e test
        run: ./tests/e2e-local.sh
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
