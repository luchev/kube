apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local dev overlay for kind-based e2e testing.
# References prod manifests directly — only patches what differs for single-node kind.
# Infrastructure (CNPG operator, Flux) is installed by the test script.

namespace: aintcode

resources:
  - ../../../apps/aintcode/k8s/namespace.yaml
  - ../../../apps/aintcode/k8s/postgres.yaml
  - ../../../apps/aintcode/k8s/server.yaml
  - ../../../apps/aintcode/k8s/web.yaml
  - secrets.yaml

images:
  - name: ghcr.io/luchev/aintcode/aintcode-server
    newTag: e2e-test
  - name: ghcr.io/luchev/aintcode/aintcode-web
    newTag: e2e-test

patches:
  # Single-node kind: 1 replica per deployment (prod uses 2)
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  # Single-node kind: 1 postgres instance (prod uses 2 with anti-affinity)
  - target:
      kind: Cluster
      name: postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 1
