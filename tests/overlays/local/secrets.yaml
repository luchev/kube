# Plain secrets for local kind testing (replaces SealedSecrets from prod).
# WARNING: These are DEVELOPMENT secrets, never use in production.

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: aintcode
type: Opaque
stringData:
  username: aintcode
  password: aintcode-dev-password

---
apiVersion: v1
kind: Secret
metadata:
  name: server-env
  namespace: aintcode
type: Opaque
stringData:
  # Auth
  JWT_SECRET: dev-jwt-secret-do-not-use-in-prod
  # SMTP (mocked — Mailpit in dev, or no-op)
  SMTP_HOST: ""
  SMTP_PORT: "1025"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASS: ""
  MAIL_FROM: dev@aintcode.local
  # Session secret
  SESSION_SECRET: dev-session-secret
  # Database
  DATABASE_URL: postgresql://aintcode:aintcode-dev-password@postgres-rw.aintcode.svc.cluster.local:5432/aintcode

---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: aintcode
type: kubernetes.io/dockerconfigjson
data:
  # Empty placeholder — won't be needed for locally-loaded images
  .dockerconfigjson: e30K
